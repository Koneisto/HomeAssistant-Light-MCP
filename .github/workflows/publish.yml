name: Publish npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2 --ignore-scripts --no-fund
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); assert.equal(process.env.RELEASE_TAG, 'v'+p.version);"
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run verify:package
      - name: Publish with trusted OIDC identity and provenance
        run: npm publish --access public --provenance
